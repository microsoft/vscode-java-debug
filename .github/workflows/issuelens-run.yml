name: Run IssueLens Agent

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

permissions: {}

concurrency:
  group: issuelens-${{ github.repository }}-issue-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      ${{ github.repository == 'microsoft/vscode-java-debug' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          github.ref_protected &&
          (github.event_name != 'issue_comment' ||
           (github.event.issue.pull_request == null &&
            github.event.sender.type == 'User' &&
            github.event.comment.user.type == 'User')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      issues: read
      id-token: write
    steps:
      - name: Run IssueLens issue loop
        uses: microsoft/IssueLens/.github/actions/issuelens@61a9e9a5ff2f9514a3bdd351a0721235cd0a2813
        with:
          request-type: issue-loop
          transport: bridge
          issue-number: ${{ inputs.issue_number || github.event.issue.number }}
          bridge-url: ${{ secrets.ISSUELENS_BRIDGE_URL }}
          output-mode: activity
          summary-mode: status
