name: Queue IssueLens Team Memory

on:
  push:
    branches: [main]

permissions: {}

jobs:
  team-memory:
    if: >-
      vars.ISSUELENS_TEAM_MEMORY_ENABLED == 'true' &&
      github.repository == 'microsoft/vscode-java-debug' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event_name == 'push' &&
      github.workflow_sha == github.sha &&
      github.event.created == false &&
      github.event.deleted == false &&
      github.event.forced == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get coordinator dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ISSUELENS_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUELENS_DISPATCH_APP_PRIVATE_KEY }}
          owner: microsoft
          repositories: vscode-java-pack
          permission-contents: read
          permission-actions: write

      - name: Queue team-memory request
        uses: microsoft/IssueLens/.github/actions/queue-team-memory@a81d2d96167fc0e69ac631c2edc85f858e693289
        with:
          dispatch-token: ${{ steps.dispatch-token.outputs.token }}
          coordinator-repository: microsoft/vscode-java-pack
          coordinator-workflow: team-memory-coordinator.yml
          coordinator-ref: main
          workflow-inputs: >-
            {"source_repository":"${{ github.repository }}",
             "source_run_id":"${{ github.run_id }}",
             "source_run_attempt":"${{ github.run_attempt }}",
             "push_before":"${{ github.event.before }}",
             "push_after":"${{ github.sha }}"}
